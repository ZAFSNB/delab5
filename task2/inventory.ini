# Инвентарь Ansible.
#
# В качестве управляемых узлов используются узлы кластера Kubernetes
# из лабораторной работы 4 (кластер kind "lab4"). Узлы kind — это
# контейнеры Docker, поэтому подключение выполняется connection-плагином
# community.docker.docker (аналог SSH для виртуальных машин).
#
# Для реальных виртуальных машин достаточно заменить ansible_connection
# на ssh и указать ansible_user / ansible_ssh_private_key_file.

[kubernetes_nodes]
control_plane ansible_host=lab4-control-plane
worker1       ansible_host=lab4-worker
worker2       ansible_host=lab4-worker2

[kubernetes_nodes:vars]
ansible_connection=docker
ansible_python_interpreter=/usr/bin/python3

# Группа всех узлов (удобно для ad hoc команд)
[all_nodes:children]
kubernetes_nodes
